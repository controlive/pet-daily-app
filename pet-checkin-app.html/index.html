<!-- 版本：v2.5.1  |  宠物每日打卡台  |  主题：薄荷奶咖·线条小狗·小红书精致感·顶部头像·今日待办·打卡密度·多宠切换·记录中心·健康事项提醒·特殊情况提醒·记账本 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>宠物每日打卡台 v2.5.1</title>
<style>
  :root{
    --bg:#F7F5F0; --bg-soft:#F0EBE3;
    --card:#FFFFFF; --card-soft:#FBF9F6;
    --ink:#3A3530; --ink-soft:#7D756C; --ink-light:#A9A299;
    --coffee:#8D6C63; --coffee-deep:#6B4F47; --coffee-light:#C4A99E;
    --mint:#CFE4DD; --mint-deep:#A8C9BE; --mint-light:#E8F2EF;
    --pink:#F8E1E0; --pink-deep:#E8B4B0; --pink-light:#FDF4F4;
    --cream:#FFF9E6; --cream-deep:#F5E6C2;
    --shadow:0 12px 32px rgba(58,53,48,.07);
    --shadow-sm:0 4px 16px rgba(58,53,48,.05);
    --radius:22px; --radius-sm:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased;
    letter-spacing:-0.2px;
  }
  .app{display:flex;flex-direction:column;height:100vh;width:100vw;}
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
  .content{flex:1;overflow-y:auto;padding:20px 18px 110px;position:relative;z-index:1}

  /* 首页顶部 */
  .home-head{margin-bottom:22px;text-align:left}
  .home-head .title-row{display:flex;align-items:baseline;gap:10px}
  .home-head .title{font-size:22px;font-weight:700;color:var(--ink);letter-spacing:-0.5px}
  .home-head .ver{font-size:10px;font-weight:600;color:var(--coffee);background:var(--mint-light);padding:3px 7px;border-radius:999px}
  .home-head .date{font-size:14px;color:var(--ink-soft);margin-top:8px;font-weight:500}
  /* 参考图顶部 */
  .pet-top{display:flex;align-items:center;gap:14px;margin-bottom:14px}
  .pet-top .pet-av{width:66px;height:66px;border-radius:50%;background:linear-gradient(135deg,#F8E1E0 0%,#FADBC8 100%);display:grid;place-items:center;font-size:34px;overflow:hidden;border:3px solid #fff;box-shadow:var(--shadow-sm);flex:none}
  .pet-top .pet-av img{width:100%;height:100%;object-fit:cover}
  .pet-top .right{display:flex;flex-direction:column;gap:8px}
  .pet-top .pet-name{font-size:22px;font-weight:700;color:var(--ink);letter-spacing:-0.5px}
  .pet-top .tag{font-size:12px;color:var(--coffee);background:#fff;border:1px solid rgba(141,108,99,.1);padding:6px 13px;border-radius:999px;font-weight:600;display:inline-block;box-shadow:var(--shadow-sm)}
  .home-title{font-size:20px;font-weight:700;color:var(--ink);letter-spacing:-0.5px;margin:4px 0 8px}
  .home-title .sparkle{font-size:16px;margin-left:4px}

  /* 进度卡片（简洁一条） */
  .progress-card{
    background:var(--cream);
    border-radius:18px;padding:10px 14px;box-shadow:var(--shadow-sm);margin-bottom:14px;
    display:flex;align-items:center;gap:10px;position:relative;
  }
  .cockerpoo{width:52px;height:52px;flex:none;position:relative;z-index:1;color:var(--coffee)}
  .puppy-icon{width:26px;height:26px;flex:none;position:relative;z-index:1;color:var(--coffee)}
  .progress-card .info{flex:1;position:relative;z-index:1;min-width:0}
  .progress-card .head-row{display:flex;justify-content:space-between;align-items:center}
  .progress-card .lab{font-size:12px;color:var(--ink-soft);font-weight:600;display:flex;align-items:center;gap:4px}
  .progress-card .pct{font-size:17px;font-weight:700;color:var(--coffee)}
  .progress-card .pct small{font-size:11px;color:var(--ink-soft);margin-left:2px;font-weight:600}
  .progress-card .pbar-wrap{position:relative;margin-top:6px;height:5px;background:#EBE6DF;border-radius:999px;overflow:hidden}
  .progress-card .pbar-fill{height:100%;width:0;background:var(--mint);border-radius:999px;transition:.5s ease;position:relative}

  /* 今日打卡 */
  .section-title{font-size:17px;font-weight:700;color:var(--ink);margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .section-title .dot{width:6px;height:6px;border-radius:50%;background:var(--mint-deep)}
  .quad-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:22px}
  .quad-card{
    background:var(--card);border-radius:var(--radius-sm);padding:18px 12px;box-shadow:var(--shadow-sm);
    display:flex;flex-direction:column;align-items:center;gap:10px;position:relative;transition:.2s;
  }
  .quad-card:active{transform:scale(.97)}
  .quad-icon{width:40px;height:40px;color:var(--coffee)}
  .quad-name{font-size:13px;font-weight:600;color:var(--ink)}
  .quad-btn{
    width:30px;height:30px;border-radius:50%;border:1.8px solid var(--mint-deep);background:var(--card);
    display:grid;place-items:center;cursor:pointer;transition:.2s;padding:0;
  }
  .quad-btn svg{width:16px;height:16px;stroke:var(--coffee);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .quad-card.done .quad-btn{background:var(--mint);border-color:var(--mint-deep)}
  .quad-card.done .quad-btn svg{stroke:#fff;stroke-width:3}
  .quad-card.done .quad-icon{color:var(--mint-deep)}

  /* 宠物小tips 便利签 */
  .tips-card{
    background:var(--cream);border-radius:18px;padding:22px 18px 18px;margin-bottom:22px;
    box-shadow:var(--shadow-sm);position:relative;transform:rotate(-.8deg);
    border:1px dashed rgba(141,108,99,.15);
  }
  .tips-card .pin{
    position:absolute;top:-9px;left:50%;transform:translateX(-50%);width:18px;height:18px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#fff 0%,var(--pink-deep) 40%,#C98A84 100%);box-shadow:0 2px 4px rgba(0,0,0,.12);
  }
  .tips-card .pin::after{content:"";position:absolute;top:4px;left:50%;transform:translateX(-50%);width:4px;height:5px;background:rgba(0,0,0,.15);border-radius:2px}
  .tips-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .tips-head h4{font-size:17px;font-weight:700;color:var(--coffee)}
  .tips-refresh{display:none}
  .tips-body{font-size:14px;color:var(--ink-soft);line-height:1.7;font-weight:500}
  .tips-body b{color:var(--coffee)}
  .dachshund{position:absolute;right:10px;bottom:6px;width:56px;height:36px;color:var(--coffee);opacity:.55}

  /* 驱虫倒计时 */
  .deworm-card{
    background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-sm);margin-bottom:18px;
    display:flex;align-items:center;gap:16px;
  }
  .deworm-card .ring{
    width:54px;height:54px;border-radius:50%;background:var(--mint-light);display:grid;place-items:center;flex:none;
  }
  .deworm-card .ring svg{width:28px;height:28px;color:var(--coffee)}
  .deworm-card .info{flex:1}
  .deworm-card .info h4{font-size:15px;font-weight:700;color:var(--ink)}
  .deworm-card .info .sub{font-size:12px;color:var(--ink-soft);margin-top:3px}
  .deworm-card .info .days{font-size:22px;font-weight:700;color:var(--coffee);margin-top:5px}
  .deworm-card .info .days small{font-size:12px;color:var(--ink-soft);margin-left:4px;font-weight:600}
  .deworm-card .btn{
    background:var(--mint);color:var(--coffee-deep);border:none;border-radius:999px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;
  }
  .deworm-card .btn.warn{background:var(--pink);color:var(--coffee-deep)}

  /* 躺平 */
  .lie-card{
    background:linear-gradient(135deg,var(--pink-light) 0%,#fff 100%);
    border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-sm);margin-bottom:22px;
    display:flex;align-items:center;gap:14px;
  }
  .lie-card .moon{width:46px;height:46px;border-radius:16px;background:var(--cream);display:grid;place-items:center;font-size:22px}
  .lie-card .moon svg{width:24px;height:24px;color:var(--coffee)}
  .lie-card .txt{flex:1}
  .lie-card .txt h4{font-size:15px;font-weight:700;color:var(--coffee)}
  .lie-card .txt p{font-size:12px;color:var(--ink-soft);margin-top:4px;line-height:1.5}
  .lie-card .btn{
    background:var(--coffee);color:#fff;border:none;border-radius:999px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;
    box-shadow:0 6px 14px rgba(141,108,99,.22);transition:.2s;font-family:inherit;
  }

  /* 日历 */
  .calendar-card{
    background:var(--card);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow-sm);margin-bottom:20px;
    max-width:320px;margin-left:auto;margin-right:auto;
  }
  .cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .cal-head h4{font-size:13px;font-weight:700;color:var(--ink)}
  .cal-head span{font-size:10px;color:var(--ink-soft);font-weight:600}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
  .cal-day-name{font-size:10px;color:var(--ink-light);font-weight:600;margin-bottom:2px}
  .cal-day{
    width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:var(--ink-soft);position:relative;
  }
  .cal-day.today{background:var(--mint);color:var(--coffee-deep)}
  .cal-day .today-paw{width:16px;height:16px;color:var(--coffee-deep)}
  .cal-day .today-paw svg{width:100%;height:100%}
  .cal-day.checked .doodle{position:absolute;inset:-2px;color:var(--mint-deep);opacity:.85;z-index:0}
  .cal-day.checked span{position:relative;z-index:1;color:var(--coffee-deep)}

  .home-sub{display:flex;justify-content:flex-start;align-items:center;gap:10px;margin-top:4px}
  .home-sub .date{font-size:14px;color:var(--ink-soft);font-weight:500}
  .home-sub{display:flex;justify-content:flex-start;align-items:center;gap:10px;margin-top:4px}
  .home-sub .date{font-size:14px;color:var(--ink-soft);font-weight:500}

  /* 首页多宠切换 */
  .pet-switch{display:flex;align-items:center;gap:8px;margin:12px 0 18px;overflow-x:auto;scrollbar-width:none}
  .pet-switch::-webkit-scrollbar{display:none}
  .pet-switch .ps-av{width:36px;height:36px;border-radius:50%;overflow:hidden;background:var(--mint-light);display:grid;place-items:center;font-size:17px;flex:none;cursor:pointer;border:2px solid transparent;opacity:.55;transition:.2s}
  .pet-switch .ps-av img{width:100%;height:100%;object-fit:cover}
  .pet-switch .ps-av.cur{border-color:var(--coffee);opacity:1;transform:scale(1.06)}
  .pet-switch .ps-more{font-size:12px;color:var(--ink-soft);font-weight:600;white-space:nowrap;cursor:pointer;flex:none}

  /* 今日待办 */
  .todo-group{margin-bottom:16px}
  .todo-group .gh{font-size:12px;font-weight:700;color:var(--ink-light);margin:0 0 10px 4px;display:flex;align-items:center;gap:6px;letter-spacing:.3px}
  .todo-group .gh .gdot{width:7px;height:7px;border-radius:50%}
  .todo{background:var(--card);border-radius:16px;padding:13px 15px;box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:12px;margin-bottom:9px;transition:.2s;cursor:pointer}
  .todo:active{transform:scale(.99)}
  .todo .t-ic{width:32px;height:32px;color:var(--coffee);flex:none}
  .todo .t-main{flex:1;min-width:0}
  .todo .t-name{font-size:14px;font-weight:600;color:var(--ink)}
  .todo .t-sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px}
  .todo .t-check{width:24px;height:24px;border-radius:50%;border:2px solid var(--mint-deep);flex:none;display:grid;place-items:center;transition:.2s;background:var(--card)}
  .todo .t-check svg{width:13px;height:13px;stroke:var(--coffee);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .todo.done{opacity:.5}
  .todo.done .t-name{text-decoration:line-through;color:var(--ink-light)}
  .todo.done .t-sub{text-decoration:line-through}
  .todo.done .t-check{background:var(--mint);border-color:var(--mint-deep)}
  .todo.done .t-check svg{stroke:#fff}
  .todo.p1 .t-ic{color:var(--pink-deep)}
  .todo.p1 .t-name{color:var(--coffee-deep)}

  /* 日历密度 & 趋势 */
  .cal-head .cal-nav{display:flex;align-items:center;gap:8px}
  .cal-head .cal-nav button{background:#F3EFEA;border:none;border-radius:50%;width:26px;height:26px;font-size:15px;color:var(--coffee);cursor:pointer;line-height:1}
  .cal-day.lvl1{background:var(--mint-light)}
  .cal-day.lvl2{background:var(--mint)}
  .cal-day.lvl3{background:var(--mint-deep)}
  .cal-day.lvl2 span,.cal-day.lvl3 span{color:#fff}
  .cal-day .cd{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--pink-deep);z-index:1}
  .cal-day.lvl3 .cd{background:#fff}
  .trend-row{display:flex;justify-content:space-around;align-items:center;margin-top:14px;padding-top:14px;border-top:1px dashed rgba(141,108,99,.15)}
  .trend-row .t-item{text-align:center;flex:1}
  .trend-row .t-item b{font-size:20px;font-weight:700;color:var(--coffee);display:block}
  .trend-row .t-item span{font-size:11px;color:var(--ink-soft)}

  /* 档案多宠 */
  .pet-list{display:flex;gap:10px;overflow-x:auto;margin-bottom:16px;padding-bottom:6px;scrollbar-width:none}
  .pet-list::-webkit-scrollbar{display:none}
  .pet-row{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:9px 12px;flex:none;min-width:140px;cursor:pointer;box-shadow:var(--shadow-sm);border:2px solid transparent;transition:.2s}
  .pet-row.cur{border-color:var(--mint-deep)}
  .pet-av-sm{width:40px;height:40px;border-radius:50%;overflow:hidden;background:var(--mint-light);display:grid;place-items:center;font-size:20px;flex:none}
  .pet-av-sm img{width:100%;height:100%;object-fit:cover}
  .pet-row-name{font-size:14px;font-weight:700;color:var(--ink)}
  .pet-row-breed{font-size:11px;color:var(--ink-soft)}
  .cur-tag{font-size:10px;color:var(--coffee);background:var(--mint-light);padding:2px 7px;border-radius:999px;font-weight:600;margin-left:auto}
  .add-pet{width:100%;margin-bottom:18px;background:var(--mint);color:var(--coffee-deep)}
  .del-pet{width:100%;margin-top:12px}

  /* 底部导航 */
  .bottomnav{
    position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);
    border-top:1px solid rgba(141,108,99,.08);display:flex;justify-content:space-around;align-items:center;
    padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:10;
  }
  .bottomnav .bn{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:14px;cursor:pointer;transition:.2s;color:var(--ink-light)}
  .bottomnav .bn.active{color:var(--coffee)}
  .bottomnav .bn .ic{width:22px;height:22px;color:currentColor}
  .bottomnav .bn .txt{font-size:9.5px;font-weight:600;white-space:nowrap;letter-spacing:-0.3px}
  @media (max-width:340px){ .bottomnav .bn .txt{font-size:9px} .bottomnav .bn .ic{width:20px;height:20px} }

  /* 页面标题 */
  .panel-head{padding:6px 0 18px;text-align:center}
  .panel-head h3{font-size:18px;font-weight:700;color:var(--ink)}
  .panel-head p{font-size:12px;color:var(--ink-soft);margin-top:3px;font-weight:500}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding-bottom:90px}
  .card{
    background:var(--card);border-radius:var(--radius-sm);padding:16px;box-shadow:var(--shadow-sm);
    display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:.2s;position:relative;overflow:hidden;
  }
  .card:active{transform:scale(.98)}
  .card .icon{width:32px;height:32px;color:var(--coffee)}
  .card h4{font-size:14px;font-weight:700;color:var(--ink)}
  .card p{font-size:11.5px;color:var(--ink-soft);line-height:1.4;font-weight:500}

  /* 第二页：记录中心 */
  .big-card{margin-bottom:14px}
  .section-title{display:flex;align-items:center;gap:8px;margin:18px 0 10px;font-size:15px;font-weight:700;color:var(--ink)}
  .section-title .dot{width:8px;height:8px;border-radius:50%;background:var(--coffee)}
  .rem-list{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
  .rem-row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--radius-sm);padding:12px 14px;box-shadow:var(--shadow-sm)}
  .rem-row .rem-ic{width:30px;height:30px;color:var(--coffee);flex:none}
  .rem-mid{flex:1;min-width:0}
  .rem-name{font-size:14px;font-weight:700;color:var(--ink)}
  .rem-sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px}
  .rem-row.done{background:var(--mint-light)}
  .rem-row.done .rem-name{color:var(--mint-deep)}
  .rem-btn{background:var(--coffee);color:#fff;border:none;border-radius:999px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;flex:none;transition:.2s}
  .rem-btn:active{transform:scale(.96)}
  .rem-btn.off{background:var(--mint);color:var(--coffee-deep)}
  .icon-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .icon-chip{border:1.5px solid #E8E3DC;border-radius:14px;padding:10px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;transition:.15s;background:#FDFBF8}
  .icon-chip .ic{font-size:20px;line-height:1}
  .icon-chip .tx{font-size:10px;color:var(--ink-soft);font-weight:600}
  .icon-chip.on{border-color:var(--coffee);background:var(--mint-light)}
  .icon-chip.on .tx{color:var(--coffee)}

  /* 详情页 */
  .detail-card{
    background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:20px;
  }
  .detail-card h2{font-size:18px;font-weight:700;color:var(--ink);margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:6px;font-weight:600}
  .field input,.field select,.field textarea{
    width:100%;border:1.5px solid #E8E3DC;border-radius:14px;padding:12px 14px;font-size:14px;font-family:inherit;color:var(--ink);background:#FDFBF8;
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--mint-deep)}
  .field textarea{min-height:80px;resize:vertical}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap}
  .btn{
    background:var(--coffee);color:#fff;border:none;border-radius:999px;padding:11px 20px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:.2s;
  }
  .btn:active{transform:scale(.97)}
  .btn.secondary{background:var(--mint);color:var(--coffee-deep)}
  .btn.ghost{background:transparent;color:var(--coffee);border:1.5px solid var(--coffee-light)}
  #chartBox{height:220px;width:100%}
  .assoc{background:var(--mint-light);border-radius:16px;padding:14px;margin-top:14px}
  .assoc h5{font-size:13px;color:var(--coffee);margin-bottom:8px;font-weight:700}
  .assoc li{font-size:12px;color:var(--ink-soft);margin:4px 0}

  /* 档案 */
  .profile-card{background:var(--card);border-radius:var(--radius);padding:22px 20px;box-shadow:var(--shadow);margin-bottom:20px}
  .avatar-wrap{width:90px;height:90px;border-radius:50%;margin:0 auto 16px;background:var(--mint-light);display:grid;place-items:center;font-size:36px;overflow:hidden;border:3px solid var(--mint)}
  .avatar-wrap img{width:100%;height:100%;object-fit:cover}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .chip{background:#F3EFEA;border:1.5px solid #E8E3DC;border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer;color:var(--ink-soft);transition:.2s;font-weight:500}
  .chip.on{background:var(--mint);color:var(--coffee-deep);border-color:var(--mint-deep)}
  .paw-save{

<script>
const VERSION='2.5.1';
const LS_KEY='petCheckin_v1';
const DAY_MS=86400000;
const WEEKDAYS=['日','一','二','三','四','五','六'];

const TIPS=[
  '多梳一次毛，就能少吞一点毛球，亲测有效～',
  '猫咪每天需要约 <b>60ml 水 / kg</b> 体重，记得骗水哦。',
  '换粮请用 <b>7 日过渡法</b>，毛孩子的玻璃胃会感谢你。',
  '每天 15 分钟互动，毛孩子的快乐真的会翻倍！',
  '猫砂盆数量 = 猫数 + 1，这是养猫人的幸福公式。',
  '出门记得检查窗户，小好奇心真的会飞走。',
  '定期刷牙，能省下很多看牙的钱和心疼。',
  '如果 TA 突然躲起来，也许只是需要一点安静的充电时间。',
  '小狗的爱永远直白又热烈，记得给 TA 一个夸夸。',
  '天气热的时候，给毛孩子备一碗常温干净的水吧～'
];

const QUOTES=[
  '你不需要每天都做到满分，爱已经够好了。',
  '偶尔的偷懒，也是给彼此留一点温柔的空间。',
  '毛孩子从不要求完美，只希望你陪在身边。',
  '今天没有完成所有计划也没关系，明天又是新的一天。',
  '你已经把最好的爱给了 TA，这就足够了。'
];

var data=loadData();
let page='home', detailMod=null, calView=null;
const content=document.getElementById('content'), bottomnav=document.getElementById('bottomnav');

function loadData(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(raw){
      let d=JSON.parse(raw);
      // 兼容 v1.3.0 及更早：单 profile 结构 → 多宠结构
      if(!d.pets){
        const prof=d.profile||{name:'',breed:'',gender:'',birth:'',avatar:''};
        const id='p_'+Date.now().toString(36);
        prof.id=id;
        d.pets=[prof];
        d.currentPetId=id;
        const remapped={}; remapped[id]=d.records||{};
        d.records=remapped;
        d.streak=d.streak?{[id]:d.streak}:{};
        d.lastDate=d.lastDate?{[id]:d.lastDate}:{};
        d.flat=d.flat||{};
      }
      if(!d.records) d.records={};
      if(!d.streak) d.streak={};
      if(!d.lastDate) d.lastDate={};
      if(!d.flat) d.flat={};
      if(!d.waterLog) d.waterLog={};
      if(!d.reminders) d.reminders={};
      if(!d.specials) d.specials={};
      if(!d.ledger) d.ledger={};
      migrateReminders(d);
      return d;
    }
  }catch(e){}
  const id='p_'+Date.now().toString(36);
  return {pets:[{id,name:'',breed:'',gender:'',birth:'',avatar:''}],currentPetId:id,records:{},streak:{},lastDate:{},flat:{},waterLog:{},reminders:{},specials:{},ledger:{}};
}
function saveData(){ localStorage.setItem(LS_KEY,JSON.stringify(data)); }
function todayKey(){ return new Date().toLocaleDateString('zh-CN'); }
function fmtDate(){ const d=new Date(); return `${d.getMonth()+1}月${d.getDate()}日 星期${WEEKDAYS[d.getDay()]}`; }
function currentPetId(){ return data.currentPetId; }
function currentPet(){ return data.pets.find(p=>p.id===data.currentPetId)||data.pets[0]; }
function petRecords(){ const pid=currentPetId(); return data.records[pid]||(data.records[pid]={}); }
function todayRecord(){ const r=petRecords(); const k=todayKey(); if(!r[k]) r[k]={}; return r[k]; }
function recordByDate(k){ const r=petRecords(); if(!r[k]) r[k]={}; return r[k]; }
function dateKeyOf(v){ return v?new Date(v).toLocaleDateString('zh-CN'):todayKey(); }
function todayISO(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

const REMINDER_COLORS={
  red:{bg:'#F8E1E0',icon:'#E8A598',text:'#C15B50',bar:'#E8A598'},
  orange:{bg:'#FFF4E0',icon:'#E8B87D',text:'#B57D3F',bar:'#E8B87D'},
  yellow:{bg:'#FFFBE6',icon:'#E3CF7A',text:'#9E8A2F',bar:'#E3CF7A'},
  green:{bg:'#E8F2EF',icon:'#8CCFB8',text:'#4A8A72',bar:'#8CCFB8'},
  blue:{bg:'#E8F0F5',icon:'#85B8D6',text:'#3E7A9E',bar:'#85B8D8'},
  pink:{bg:'#FDF4F4',icon:'#E8B4B0',text:'#A86B66',bar:'#E8B4B0'}
};
function pickIconByName(name,def='pill'){
  const n=(name||'').toLowerCase();
  if(/疫苗|打针|狂犬|针|免疫/.test(n)) return 'syringe';
  if(/驱虫|跳蚤|蜱虫|体内|体外|虫/.test(n)) return 'leaf';
  if(/体检|医院|医生|健康|就诊|复查|检查|诊疗/.test(n)) return 'med';
  if(/剪毛|美容|洗澡|洗护|修毛|清洁|护理|spa/.test(n)) return 'drop';
  if(/指甲|剪指/.test(n)) return 'med';
  if(/喂食|吃饭|饭|粮|罐|水|零食/.test(n)) return 'bowl';
  if(/便便|厕所|猫砂|排泄|拉|尿|屎/.test(n)) return 'litterbox';
  if(/睡觉|休息|窝|床/.test(n)) return 'bed';
  if(/玩耍|球|玩具|运动|跑|跳/.test(n)) return 'ball';
  if(/遛弯|散步|出门|走路|随行/.test(n)) return 'walk';
  if(/体重|称重/.test(n)) return 'scale';
  if(/药|药丸|吃药|喂药/.test(n)) return 'pill';
  if(/爱心|喜欢|纪念|情绪/.test(n)) return 'heart';
  return def;
}
function defaultReminders(){
  return [
    {id:'deworm',name:'体内驱虫',cycleDays:30,color:'red',icon:pickIconByName('体内驱虫','pill'),lastDone:'',history:[]},
    {id:'vaccine',name:'疫苗接种',cycleDays:365,color:'orange',icon:pickIconByName('疫苗接种','syringe'),lastDone:'',history:[]},
    {id:'bath',name:'美容洗澡',cycleDays:15,color:'green',icon:pickIconByName('美容洗澡','drop'),lastDone:'',history:[]}
  ];
}
function defaultSpecials(){
  return [
    {id:'heat',name:'发情期记录',cycleDays:180,color:'pink',icon:pickIconByName('发情期记录','heart'),lastDone:'',history:[]},
    {id:'cycle',name:'吃药周期',cycleDays:7,color:'orange',icon:pickIconByName('吃药周期','pill'),lastDone:'',history:[]},
    {id:'vomit',name:'呕吐软便观察',cycleDays:14,color:'red',icon:pickIconByName('呕吐软便观察','heart'),lastDone:'',history:[]},
    {id:'abnormal',name:'异常行为观察',cycleDays:10,color:'yellow',icon:pickIconByName('异常行为观察','ball'),lastDone:'',history:[]}
  ];
}
function migrateReminders(d){
  if(!d.reminders) d.reminders={};
  if(!d.specials) d.specials={};
  d.pets.forEach(p=>{
    const pid=p.id;
    if(!d.reminders[pid]) d.reminders[pid]=defaultReminders();
    if(!d.specials[pid]) d.specials[pid]=defaultSpecials();
    const recs=d.records[pid]||{};
    // 从旧 deworm 记录推导 lastDone
    const dew=d.reminders[pid].find(x=>x.id==='deworm');
    if(dew && !dew.lastDone){
      const days=Object.keys(recs).sort();
      for(let i=days.length-1;i>=0;i--){
        if(recs[days[i]].deworm && recs[days[i]].deworm.length){ dew.lastDone=days[i]; break; }
      }
    }
    // 从旧 vaccine.next 推导 lastDone（使下次到期日与旧记录一致）
    const vac=d.reminders[pid].find(x=>x.id==='vaccine');
    if(vac && !vac.lastDone){
      let nextDate='';
      Object.keys(recs).sort().forEach(day=>{
        (recs[day].vaccine||[]).forEach(e=>{ if(e.next) nextDate=e.next; });
      });
      if(nextDate){
        const nd=new Date(nextDate);
        vac.lastDone=new Date(nd.getTime()-vac.cycleDays*DAY_MS).toLocaleDateString('zh-CN');
      }
    }
  });
}
function getReminders(pid){
  if(!data.reminders[pid]) data.reminders[pid]=defaultReminders();
  return data.reminders[pid];
}
function computeReminder(r){
  const today=new Date(); today.setHours(0,0,0,0);
  if(!r.lastDone) return {diff:null,nextDate:null,state:'never'};
  const last=new Date(r.lastDone); last.setHours(0,0,0,0);
  const next=new Date(last.getTime()+r.cycleDays*DAY_MS);
  const diff=Math.ceil((next-today)/DAY_MS);
  const nextDate=next.toLocaleDateString('zh-CN');
  return {diff,nextDate,state:diff<0?'overdue':(diff===0?'today':'future')};
}
function formatDateShort(dstr){
  if(!dstr) return '';
  const d=new Date(dstr);
  const m=(d.getMonth()+1).toString().padStart(2,'0');
  const day=d.getDate().toString().padStart(2,'0');
  return `${m}月${day}日`;
}
function formatDateISO(dstr){
  if(!dstr) return '';
  const d=new Date(dstr);
  const y=d.getFullYear();
  const m=(d.getMonth()+1).toString().padStart(2,'0');
  const day=d.getDate().toString().padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function formatReminderSub(r,withName=true){
  const c=computeReminder(r);
  const n=withName?(r.name||'该事项'):'';
  if(c.state==='never') return `${n}还没记录过 · 每${r.cycleDays}天一次`;
  if(c.state==='overdue') return `${n}已逾期 ${Math.abs(c.diff)} 天（${formatDateShort(c.nextDate)}）`;
  if(c.state==='today') return `${n}还有 0 天（今天到期）`;
  return `${n}还有 ${c.diff} 天（${formatDateShort(c.nextDate)}）`;
}

// 添加/编辑提醒时，根据「上次处理日期 + 周期」实时预览倒计时与上次时间
function bindReminderPreview(){
  const preview=document.getElementById('rPreview'); if(!preview) return;
  const upd=()=>{
    const last=document.getElementById('rLast')?.value;
    const cycle=parseInt(document.getElementById('rCycle')?.value)||0;
    if(!last||!cycle){ preview.innerHTML=''; return; }
    const ld=new Date(last+'T00:00:00'); ld.setHours(0,0,0,0);
    const next=new Date(ld.getTime()+cycle*DAY_MS);
    const today=new Date(); today.setHours(0,0,0,0);
    const diff=Math.ceil((next-today)/DAY_MS);
    const label=diff<0?`已逾期 ${Math.abs(diff)} 天`:(diff===0?'今天到期':`还有 ${diff} 天`);
    preview.innerHTML=`<span>上次处理：${formatDateShort(last)}</span><span>倒计时：${label}（${formatDateShort(next.toLocaleDateString('zh-CN'))}）</span>`;
  };
  const le=document.getElementById('rLast'), ce=document.getElementById('rCycle');
  if(le) le.addEventListener('input',upd);
  if(ce) ce.addEventListener('input',upd);
  upd();
}

function compressPhoto(file,max=256){
  return new Promise((resolve)=>{
    const reader=new FileReader();
    reader.onload=(e)=>{
      const img=new Image();
      img.onload=()=>{
        const c=document.createElement('canvas'); let w=img.width,h=img.height;
        if(w>h){ if(w>max){ h=Math.round(h*max/w); w=max; } }
        else if(h>max){ w=Math.round(w*max/h); h=max; }
        c.width=w; c.height=h; const ctx=c.getContext('2d');
        ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h); ctx.drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg',.75));
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// ========== 头像裁剪 ==========
const CROP_STAGE=262, CROP_OUT=256;
const cropMask=document.getElementById('cropMask');
const cropStage=document.getElementById('cropStage');
const cropImg=document.getElementById('cropImg');
const cropZoom=document.getElementById('cropZoom');
let cropState=null, cropDragging=false, cropSX=0, cropSY=0, cropTX=0, cropTY=0;

function openCropper(file){
  const reader=new FileReader();
  reader.onload=(e)=>{
    const img=new Image();
    img.onload=()=>{
      const base=Math.max(CROP_STAGE/img.width, CROP_STAGE/img.height);
      const dispW=img.width*base, dispH=img.height*base;
      cropState={img, base, sw:img.width, sh:img.height, scale:1,
        tx:(CROP_STAGE-dispW)/2, ty:(CROP_STAGE-dispH)/2};
      cropZoom.value='1';
      cropImg.src=img.src;
      applyCrop();
      cropMask.classList.add('show');
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}
function applyCrop(){
  if(!cropState) return;
  const eff=cropState.base*cropState.scale;
  cropImg.style.width=(cropState.sw*eff)+'px';
  cropImg.style.height=(cropState.sh*eff)+'px';
  cropImg.style.transform=`translate(${cropState.tx}px,${cropState.ty}px)`;
}
function clampCrop(){
  if(!cropState) return;
  const eff=cropState.base*cropState.scale;
  const dispW=cropState.sw*eff, dispH=cropState.sh*eff;
  cropState.tx=Math.min(0, Math.max(CROP_STAGE-dispW, cropState.tx));
  cropState.ty=Math.min(0, Math.max(CROP_STAGE-dispH, cropState.ty));
}
cropStage.addEventListener('pointerdown',(e)=>{
  cropDragging=true; cropStage.classList.add('drag');
  cropSX=e.clientX; cropSY=e.clientY; cropTX=cropState.tx; cropTY=cropState.ty;
  cropStage.setPointerCapture(e.pointerId);
});
cropStage.addEventListener('pointermove',(e)=>{
  if(!cropDragging||!cropState) return;
  cropState.tx=cropTX+(e.clientX-cropSX);
  cropState.ty=cropTY+(e.clientY-cropSY);
  clampCrop(); applyCrop();
});
function endDrag(){ cropDragging=false; cropStage.classList.remove('drag'); }
cropStage.addEventListener('pointerup',endDrag);
cropStage.addEventListener('pointercancel',endDrag);
cropZoom.addEventListener('input',()=>{
  if(!cropState) return;
  const c=CROP_STAGE/2, effB=cropState.base*cropState.scale;
  const srcX=(c-cropState.tx)/effB, srcY=(c-cropState.ty)/effB;
  cropState.scale=parseFloat(cropZoom.value);
  const effN=cropState.base*cropState.scale;
  cropState.tx=c-srcX*effN; cropState.ty=c-srcY*effN;
  clampCrop(); applyCrop();
});
function cropConfirm(){
  if(!cropState) return;
  const eff=cropState.base*cropState.scale;
  const canvas=document.createElement('canvas'); canvas.width=CROP_OUT; canvas.height=CROP_OUT;
  const ctx=canvas.getContext('2d');
  const sx=(0-cropState.tx)/eff, sy=(0-cropState.ty)/eff, sW=CROP_STAGE/eff, sH=CROP_STAGE/eff;
  ctx.drawImage(cropState.img, sx, sy, sW, sH, 0, 0, CROP_OUT, CROP_OUT);
  const url=canvas.toDataURL('image/jpeg',0.9);
  currentPet().avatar=url; saveData();
  const aw=document.getElementById('avatarWrap'); if(aw) aw.innerHTML=`<img src="${url}">`;
  cropMask.classList.remove('show'); cropState=null;
}
function closeCropper(){ cropMask.classList.remove('show'); cropState=null; }
document.getElementById('cropOk').onclick=cropConfirm;
document.getElementById('cropCancel').onclick=closeCropper;
cropMask.addEventListener('click',(e)=>{ if(e.target===cropMask) closeCropper(); });

function buildQuad(){

function toggleTodo(id){
  const rec=todayRecord();
  if(rec[id]&&rec[id].length){ rec[id]=[]; }
  else { rec[id]=[{t:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),note:''}]; }
  updateStreak(); saveData(); renderHome();
}

function completeReminder(id){
  const list=getReminders(currentPetId());
  const r=list.find(x=>x.id===id);
  if(!r) return;
  const tk=todayKey();
  r.lastDone=tk;
  if(!r.history) r.history=[];
  if(!r.history.includes(tk)) r.history.push(tk);
  // 同步到今日打卡记录，让首页可显示完成
  const rec=todayRecord();
  if(!rec[id]) rec[id]=[];
  rec[id].push({t:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),note:'已处理'});
  updateStreak(); saveData(); render();
}

function randomTip(){ return TIPS[Math.floor(Math.random()*TIPS.length)]; }

function updateStreak(){
  const pid=currentPetId();
  const k=todayKey();
  if(!data.lastDate) data.lastDate={};
  if(!data.streak) data.streak={};
  const last=data.lastDate[pid], st=data.streak[pid]||0;
  if(last!==k){
    if(last){
      const yest=new Date(Date.now()-DAY_MS).toLocaleDateString('zh-CN');
      if(last===yest) data.streak[pid]=st+1;
      else data.streak[pid]=1;
    }else data.streak[pid]=1;
    data.lastDate[pid]=k;
  }
}

// ========== 日历 ==========
function renderCalendar(){
  const d=new Date();
  if(!calView) calView={y:d.getFullYear(),m:d.getMonth()};
  const {y,m}=calView;
  const first=new Date(y,m,1);
  const lastDay=new Date(y,m+1,0).getDate();
  const startW=first.getDay();
  const monthNames=['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  const recs=petRecords();
  let monthChecked=0;
  let days='';
  for(let i=0;i<startW;i++) days+=`<div></div>`;
  for(let day=1;day<=lastDay;day++){
    const dateStr=new Date(y,m,day).toLocaleDateString('zh-CN');
    const r=recs[dateStr];
    const n=r?Object.keys(r).length:0;
    const isToday=(day===d.getDate()&&m===d.getMonth()&&y===d.getFullYear());
    let lvl='',dot='';
    if(n>0){
      monthChecked++;
      lvl=n>=5?'lvl3':n>=3?'lvl2':'lvl1';
      dot=`<div class="cd"></div>`;
    }
    const doodle=DOODLES[day%DOODLES.length];
    const inner=isToday?`<div class="today-paw">${ICONS.paw}</div>`:`<span>${day}</span>`;
    days+=`<div class="cal-day ${lvl} ${isToday?'today':''}">
      ${(!isToday&&n>0)?`<div class="doodle">${doodle}</div>`:''}${dot}${inner}
    </div>`;
  }
  const totalDays=Object.keys(recs).filter(k=>Object.keys(recs[k]).length>0).length;
  const streak=(data.streak&&data.streak[currentPetId()])||0;
  const isCur=(y===d.getFullYear()&&m===d.getMonth());
  return `<div class="calendar-card">
    <div class="cal-head">
      <h4>${y}年${monthNames[m]}</h4>
      <div class="cal-nav"><button id="calPrev">‹</button><button id="calNext">›</button></div>
    </div>
    <div class="cal-grid">
      <div class="cal-day-name">日</div><div class="cal-day-name">一</div><div class="cal-day-name">二</div><div class="cal-day-name">三</div>
      <div class="cal-day-name">四</div><div class="cal-day-name">五</div><div class="cal-day-name">六</div>
      ${days}
    </div>
    <div class="trend-row">
      <div class="t-item"><b>${monthChecked}</b><span>${isCur?'本月打卡':'该月打卡'}（天）</span></div>
      <div class="t-item"><b>${streak}</b><span>连续打卡（天）</span></div>
      <div class="t-item"><b>${totalDays}</b><span>累计打卡（天）</span></div>
    </div>
  </div>`;
}

function recentWaterLogs(n=5){
  const recs=petRecords(); const rows=[];
  Object.keys(recs).sort().reverse().forEach(k=>{
    (recs[k].wf_water||[]).slice().reverse().forEach(e=>{
      if(rows.length<n) rows.push(`<div class="history-item">${k} · ${e.ml}ml${e.note?' · '+esc(e.note):''}</div>`);
    });
  });
  return rows.join('');
}

function renderWfHistory(mod){
  const box=document.getElementById('wfHistory'); if(!box) return;
  const recs=petRecords();
  const rows=[];
  Object.keys(recs).sort().reverse().forEach(k=>{
    (recs[k][mod]||[]).forEach((e,i)=>rows.push({k,i,e}));
  });
  if(!rows.length){ box.innerHTML='<p class="empty-tip">还没有记录，快来记一条吧～</p>'; return; }
  let body='';
  if(mod==='wf_poop'){
    body=rows.map(r=>`<tr>
      <td>${r.k}</td>
      <td>${POOP_SHAPES[r.e.shape]||r.e.shape||'—'}</td>
      <td>${POOP_COLORS[r.e.color]||r.e.color||'—'}</td>
      <td><button class="del-rec" data-d="${r.k}" data-i="${r.i}">删除</button></td>
    </tr>`).join('');
    box.innerHTML=`<table class="rec-table"><caption><span class="dot"></span>每日记录</caption>
      <thead><tr><th>日期</th><th>形状</th><th>颜色 / 状态</th><th></th></tr></thead>
      <tbody>${body}</tbody></table>`;
  }else{
    body=rows.map(r=>`<tr>

      <td>${esc(r.e.route||'—')}</td>

    </tr>`).join('');

function saveDetail(mod){
  const rec=todayRecord();
  if(!rec[mod]) rec[mod]=[];
  let custom=false, stay=null;
  const entry={t:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})};
  const get=(id)=>document.getElementById(id)?.value;
  const chips=(id)=>[...document.querySelectorAll('#'+id+' .chip.on')].map(c=>c.dataset.v);
  const dkey=()=>dateKeyOf(document.getElementById('fDate')?.value);
  const pushTo=(k)=>{ const r=recordByDate(dkey()); if(!r[k]) r[k]=[]; r[k].push(entry); };

  if(mod==='food'){ entry.gram=get('fGram'); entry.note='吃饭'; }
  else if(mod==='water'){ entry.note=get('fNote')||'更换饮水'; }
  else if(mod==='poop'){ entry.shape=get('fShape'); }
  else if(mod==='walk'){ entry.min=get('fMin'); entry.route=get('fRoute'); }
  else if(mod==='deworm'){ entry.type=get('fType'); entry.nextDays=get('fDays'); }
  else if(mod==='vaccine'){ entry.name=get('fName'); entry.next=get('fDate'); }
  else if(mod==='bath'){ entry.items=chips('fItems'); }
  else if(mod==='weight'){ entry.w=get('fW'); entry.temperature=get('fT'); }
  else if(mod==='medicine'){ entry.med=get('fMed'); entry.status=chips('fStatus')[0]||'按时'; }
  else if(mod==='stool'){ entry.color=get('fColor'); entry.hard=get('fHard'); }
  else if(mod==='vomit'){ entry.count=get('fCount'); entry.photo=getPhoto('fPhoto'); entry.associations=smartAssoc(true); }
  else if(mod==='abnormal'){ entry.items=chips('fAb'); }
  else if(mod==='play'){ entry.min=get('fMin'); }
  else if(mod==='train'){ entry.skill=get('fSkill'); }
  else if(mod==='alone'){ entry.hours=get('fH'); }
  else if(mod==='heat'){ entry.start=get('fStart'); entry.end=get('fEnd'); }
  else if(mod==='cycle'){ entry.med=get('fMed'); entry.days=get('fDays'); }
  else if(mod==='photo'){ entry.photo=getPhoto('fPhoto'); entry.note=get('fNote'); }
  else if(mod==='fun'){ entry.note=get('fNote'); }
  else if(mod==='health_daily'){ entry.status=get('fStatus'); }
  else if(mod==='wf_weight'){ custom=true; entry.w=get('fW'); entry.gram=get('fGram'); entry.note=get('fNote')||''; pushTo('wf_weight'); }
  else if(mod==='wf_water'){
    const ml=get('fMl');
    if(!ml || parseFloat(ml)<=0){ alert('请输入喝水量（ml）'); return; }
    custom=true; entry.ml=parseFloat(ml); entry.note=get('fNote')||''; pushTo('wf_water');
    if(dkey()===todayKey()){ if(!rec.water) rec.water=[]; rec.water.push({t:entry.t,note:'喝水 '+entry.ml+'ml'}); }
  }
  else if(mod==='wf_poop'){ custom=true; entry.shape=document.querySelector('#fShape .icon-chip.on')?.dataset.v||''; entry.color=document.querySelector('#fColor .icon-chip.on')?.dataset.v||''; pushTo('wf_poop'); stay='wf_poop'; }
  else if(mod==='wf_walk'){ custom=true; entry.min=get('fMin'); entry.route=get('fRoute')||''; pushTo('wf_walk'); stay='wf_walk'; }
  else { entry.note='已打卡'; }

  if(!custom) rec[mod].push(entry);
  updateStreak();
  saveData();
  if(stay){ openDetail(stay); return; }
  if(custom) detailMod=null;
  render();
}

function smartAssoc(returnHtml){
  const rec=todayRecord();
  const food=(rec.food||[]).map(e=>e.gram?e.gram+'g 粮食':e.note||'吃饭').join('；');
  const water=(rec.water||[]).length?'今日已换水':'未记录换水';
  const dew=(rec.deworm||[]).length?'近期有驱虫':'未记录驱虫';
  const vac=(rec.vaccine||[]).length?'近期有疫苗':'未记录疫苗';
  let html=`<ul>`;
  if(food) html+=`<li>🍚 饮食：${food}</li>`;
  html+=`<li>💧 饮水：${water}</li>`;
  html+=`<li>🪱 驱虫：${dew}</li>`;
  html+=`<li>💉 疫苗：${vac}</li>`;
  html+=`</ul><p style="font-size:12px;color:#8D6C63;margin-top:8px;font-weight:500">提示：若呕吐伴随换粮/驱虫/疫苗，请留意是否为新食物或应激反应；持续呕吐建议就医。</p>`;
  if(returnHtml) return html;
  return html;
}

function drawWeightChart(key='weight'){
  const box=document.getElementById('chartBox'); if(!box) return;
  const recs=petRecords();
  const days=Object.keys(recs).sort().slice(-14);
  const pts=days.map(d=>{
    const arr=recs[d][key]||[];
    const e=arr.find(x=>x.w&&parseFloat(x.w)>0);
    return e?{d,v:parseFloat(e.w)}:null;
  }).filter(Boolean);
  if(pts.length<2){ box.innerHTML='<p style="text-align:center;color:#999;font-size:12px;padding-top:40px">记录 2 次以上体重即可生成折线图</p>'; return; }
  const w=box.clientWidth||300,h=220,p=30;
  const vals=pts.map(x=>x.v);
  const max=Math.max(...vals),min=Math.min(...vals),range=max-min||1;
  const coords=pts.map((pt,i)=>{
    const x=p+(w-2*p)*(i/(pts.length-1));
    const y=h-p-((pt.v-min)/range)*(h-2*p);
    return x.toFixed(1)+','+y.toFixed(1);
  });
  const dots=coords.map(c=>`<circle cx="${c.split(',')[0]}" cy="${c.split(',')[1]}" r="3.5" fill="#fff" stroke="#8D6C63" stroke-width="2"/>`).join('');
  const labels=pts.map((pt,i)=>(i===0||i===pts.length-1)?`<text x="${coords[i].split(',')[0]}" y="${h-8}" text-anchor="middle" fill="#A9A299" font-size="10">${pt.d.slice(-5)}</text>`:'').join('');
  box.innerHTML=`<svg width="${w}" height="${h}" style="overflow:visible"><polyline points="${coords.join(' ')}" fill="none" stroke="#8D6C63" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${dots}${labels}<text x="${w/2}" y="16" text-anchor="middle" fill="#8D6C63" font-size="11" font-weight="600">体重趋势 (kg)</text></svg>`;
}

// ========== 记账本 ==========
const LEDGER_CATS={
  expense:['口粮','零食','医疗','用品','美容','寄养','交通','其他'],
  income:['报销','转卖','红包','其他']
};
const LEDGER_CAT_ICON={口粮:'bowl',零食:'bowl',医疗:'med',用品:'ball',美容:'drop',寄养:'bed',交通:'walk',其他:'coin',报销:'coin',转卖:'coin',红包:'heart'};
let ledgerEditId=null, ledgerView=null;

function getLedger(pid){ if(!data.ledger) data.ledger={}; if(!data.ledger[pid]) data.ledger[pid]=[]; return data.ledger[pid]; }
function fmtMoney(v){ return (Math.round((parseFloat(v)||0)*100)/100).toFixed(2); }
function ledgerStats(list,ym){
  let exp=0,inc=0;
  list.forEach(x=>{
    if((x.date||'').slice(0,7)!==ym) return;
    const v=parseFloat(x.amount)||0; if(x.type==='income') inc+=v; else exp+=v;
  });
  return {exp,inc,balance:inc-exp};
}
function sortedLedger(pid){
  return getLedger(pid).slice().sort((a,b)=>
    (b.date||'').localeCompare(a.date||'') || (b.createdAt||0)-(a.createdAt||0));
}
function renderLedgerPage(){
  const pid=currentPetId();
  const list=sortedLedger(pid);
  const now=new Date();
  if(!ledgerView) ledgerView={y:now.getFullYear(),m:now.getMonth()};
  const ym=`${ledgerView.y}-${String(ledgerView.m+1).padStart(2,'0')}`;
  const st=ledgerStats(list,ym);
  const monthRows=list.filter(x=>(x.date||'').slice(0,7)===ym);

  content.innerHTML=`
    <div class="ledger-head"><h3>记账</h3><p>${esc(currentPet().name||'我的宝贝')} · ${ledgerView.y}年${ledgerView.m+1}月</p></div>
    <div class="ledger-sum">
      <div class="ls-item"><span>累计支出</span><b class="exp">¥${fmtMoney(st.exp)}</b></div>
      <div class="ls-item"><span>累计收入</span><b class="inc">¥${fmtMoney(st.inc)}</b></div>
      <div class="ls-item"><span>当前结余</span><b class="bal">${st.balance<0?'-':''}¥${fmtMoney(Math.abs(st.balance))}</b></div>
    </div>
    <div class="section-title"><div class="dot"></div>快速记录</div>
    <div class="quick-row">
      ${LEDGER_CATS.expense.slice(0,5).map(c=>`<button class="quick-chip" data-cat="${c}">${c}</button>`).join('')}
      <button class="quick-chip inc" data-cat="报销" data-type="income">+收入</button>
    </div>
    <div class="section-title"><div class="dot"></div>最近记录
      <div class="cal-nav" style="margin-left:auto"><button id="ledPrev">‹</button><button id="ledNext">›</button></div>
    </div>
    <div class="led-list">
      ${monthRows.length?monthRows.slice(0,30).map(x=>`
        <div class="led-row" data-id="${x.id}">
          <div class="led-ic">${ICONS[LEDGER_CAT_ICON[x.category]||'coin']||ICONS.paw}</div>
          <div class="led-mid">
            <div class="led-name">${esc(x.name)}</div>
            <div class="led-meta">${formatDateShort(x.date)} · ${esc(x.category||'其他')}${x.note?' · '+esc(x.note):''}</div>
          </div>
          <div class="led-amt ${x.type==='income'?'inc':'exp'}">${x.type==='income'?'+':'-'}¥${fmtMoney(x.amount)}</div>
        </div>`).join(''):`<p class="empty-tip">本月还没有记录，点下面按钮记一笔吧～</p>`}
    </div>
    <button class="add-reminder" id="addLedgerBtn">＋ 记一笔</button>
  `;
  content.querySelectorAll('.led-row').forEach(r=>r.onclick=()=>{ ledgerEditId=r.dataset.id; openAddLedger(); });
  content.querySelectorAll('.quick-chip').forEach(b=>b.onclick=()=>{
    ledgerEditId=null; openAddLedger({cat:b.dataset.cat,type:b.dataset.type||'expense'});
  });
  document.getElementById('addLedgerBtn').onclick=()=>{ ledgerEditId=null; openAddLedger(); };
  document.getElementById('ledPrev').onclick=()=>{ ledgerView.m--; if(ledgerView.m<0){ledgerView.m=11;ledgerView.y--;} renderLedgerPage(); };
  document.getElementById('ledNext').onclick=()=>{ ledgerView.m++; if(ledgerView.m>11){ledgerView.m=0;ledgerView.y++;} renderLedgerPage(); };
}
function ledgerCatChips(type,cur){
  const arr=LEDGER_CATS[type]||LEDGER_CATS.expense;
  return arr.map((c,i)=>`<span class="chip ${((cur&&cur===c)||(!cur&&i===0))?'on':''}" data-v="${c}">${c}</span>`).join('');
}
function openAddLedger(preset){
  if(typeof preset==='string') preset=null;
  detailMod='addLedger';
  const back=`<button class="btn ghost" id="backBtn">← 返回</button>`;
  const it=ledgerEditId?getLedger(currentPetId()).find(x=>x.id===ledgerEditId):null;
  const type=it?it.type:(preset&&preset.type)||'expense';
  const cat=it?it.category:(preset&&preset.cat)||LEDGER_CATS[type][0];
  content.innerHTML=`<div class="detail-card"><h2>${it?'✏️ 编辑记录':'＋ 记一笔'}</h2>
    <input type="hidden" id="lId" value="${it?it.id:''}">
    <div class="field"><label>类型</label><div class="chips" id="lType">
      <span class="chip ${type==='expense'?'on':''}" data-v="expense">支出</span>
      <span class="chip ${type==='income'?'on':''}" data-v="income">收入</span>
    </div></div>
    <div class="field"><label>名称</label><input type="text" id="lName" value="${it?esc(it.name):''}" placeholder="如：进口猫粮 / 疫苗费"></div>
    <div class="field"><label>金额（元）</label><input type="number" step="0.01" min="0" id="lAmount" value="${it?it.amount:''}" placeholder="0.00"></div>
    <div class="field"><label>分类</label><div class="chips" id="lCat">${ledgerCatChips(type,cat)}</div></div>
    <div class="field"><label>日期</label><input type="date" id="lDate" value="${it?it.date:todayISO()}"></div>
    <div class="field"><label>备注</label><input type="text" id="lNote" value="${it?esc(it.note||''):''}" placeholder="可选"></div>
    <div class="btn-row">${back}<button class="btn" id="saveBtn">${it?'保存修改':'保存'}</button>${it?'<button class="btn ghost" id="delLedgerBtn">删除这条</button>':''}</div>
  </div>`;
  document.getElementById('backBtn').onclick=()=>{ detailMod=null; ledgerEditId=null; render(); };
  document.getElementById('saveBtn').onclick=saveLedger;
  const dl=document.getElementById('delLedgerBtn');
  if(dl) dl.onclick=()=>deleteLedger(it.id);
  const bindCat=()=>document.querySelectorAll('#lCat .chip').forEach(c=>c.onclick=function(){
    document.querySelectorAll('#lCat .chip').forEach(x=>x.classList.remove('on')); this.classList.add('on');
  });
  document.querySelectorAll('#lType .chip').forEach(c=>c.onclick=function(){
    document.querySelectorAll('#lType .chip').forEach(x=>x.classList.remove('on')); this.classList.add('on');
    document.getElementById('lCat').innerHTML=ledgerCatChips(this.dataset.v); bindCat();
  });
  bindCat();
}
function saveLedger(){
  const id=document.getElementById('lId').value;
  const name=document.getElementById('lName').value.trim();
  const amount=parseFloat(document.getElementById('lAmount').value);
  const type=document.querySelector('#lType .chip.on')?.dataset.v||'expense';
  const category=document.querySelector('#lCat .chip.on')?.dataset.v||'其他';
  const date=document.getElementById('lDate').value||todayISO();
  const note=document.getElementById('lNote').value.trim();
  if(!name){ alert('请输入名称'); return; }
  if(!(amount>0)){ alert('请输入大于 0 的金额'); return; }
  const list=getLedger(currentPetId());
  if(id){ const it=list.find(x=>x.id===id); if(it) Object.assign(it,{name,amount,type,category,date,note}); }
  else list.push({id:'l_'+Date.now().toString(36),name,amount,type,category,date,note,createdAt:Date.now()});
  saveData();
  ledgerEditId=null; detailMod=null; page='ledger';
  ledgerView={y:+date.slice(0,4),m:+date.slice(5,7)-1};
  render(); updateNav();
}
function deleteLedger(id){
  const list=getLedger(currentPetId());
  const it=list.find(x=>x.id===id); if(!it) return;
  if(!confirm(`确定删除「${it.name}」这条记录吗？`)) return;
  data.ledger[currentPetId()]=list.filter(x=>x.id!==id);
  saveData(); ledgerEditId=null; detailMod=null; page='ledger'; render(); updateNav();
}

// ========== 渲染与导航 ==========
const DETAIL_ROUTES={addReminder:openAddReminder,addSpecial:openAddSpecial,addLedger:openAddLedger,editReminder:openEditReminder,editSpecial:openEditSpecial};
function render(){
  if(detailMod){
    const fn=DETAIL_ROUTES[detailMod];
    if(fn){ fn(); if(document.getElementById('rPreview')) bindReminderPreview(); return; }
    openDetail(detailMod); return;
  }
  if(page==='home') renderHome();
  else if(page==='profile') renderProfile();
  else if(page==='feeding') renderRecords();
  else if(page==='health') renderHealthPage();
  else if(page==='special') renderSpecialPage();
  else if(page==='ledger') renderLedgerPage();
  else renderCategory(page);
}

bottomnav.querySelectorAll('.bn').forEach(b=>{
  b.onclick=()=>{ page=b.dataset.id; detailMod=null; render(); updateNav(); };
});
function updateNav(){
  bottomnav.querySelectorAll('.bn').forEach(b=>b.classList.toggle('active',b.dataset.id===page));
}

window.addEventListener('load',()=>{ render(); updateNav(); });
</script>
